<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>Telegram Proxy // AutoConnector</title>
<style>
  :root{--bg:#000;--card:rgba(6,6,6,.86);--card2:rgba(18,18,18,.9);--line:#2c2c2c;--line2:#4a4a4a;--fg:#ececec;--mute:#8d8d8d;--acc:#fff;--ok:#39ff88;--mid:#ffd23f;--bad:#ff4d5e;
        --mono:ui-monospace,"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace}
  *{box-sizing:border-box}
  html{background:#000}
  body{margin:0;background:transparent;color:var(--fg);font:15px/1.65 Tahoma,Vazirmatn,"Segoe UI",system-ui,sans-serif}
  html[lang=en] body{font-family:var(--mono);font-size:14px}
  #rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.32;pointer-events:none}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
  .wrap{position:relative;z-index:2;max-width:780px;margin:0 auto;padding:18px 14px 96px}
  header{display:flex;align-items:flex-start;gap:12px}
  header .t{flex:1}
  .kicker{font:11px var(--mono);letter-spacing:.25em;color:var(--mute);direction:ltr;text-align:start}
  h1{font-size:21px;margin:2px 0 2px;letter-spacing:.02em;text-shadow:0 0 12px rgba(255,255,255,.35)}
  h1::after{content:"▌";margin-inline-start:4px;animation:blink 1.1s steps(1) infinite;color:var(--acc)}
  @keyframes blink{50%{opacity:0}}
  h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px;letter-spacing:.04em}
  h2::before{content:"//";font-family:var(--mono);color:var(--mute)}
  .sub,.note{color:var(--mute);font-size:12.5px}
  .hero{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 10px}
  button,.btn{font:inherit;font-size:14px;border:1px solid var(--line2);background:#000;color:var(--fg);border-radius:4px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s,box-shadow .15s}
  button:hover:not(:disabled),.btn:hover{background:var(--fg);color:#000;box-shadow:0 0 14px rgba(255,255,255,.35)}
  .primary{background:var(--acc);border-color:var(--acc);color:#000;font-weight:bold;flex:1 1 220px;justify-content:center;padding:13px;box-shadow:0 0 18px rgba(255,255,255,.25)}
  .primary:hover{background:#000!important;color:#fff!important}
  button:disabled{opacity:.45;cursor:default}
  #lang{font:12px var(--mono);padding:6px 10px;letter-spacing:.1em}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin:12px 0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--mute);display:inline-block}
  .dot.live{background:var(--ok);box-shadow:0 0 0 0 rgba(57,255,136,.6);animation:pulse 1.6s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 7px rgba(57,255,136,0)}100%{box-shadow:0 0 0 0 rgba(57,255,136,0)}}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
  .tile{background:var(--card2);border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-height:68px}
  .tile .k{font-size:11.5px;color:var(--mute)}
  .tile .v{font:bold 18px var(--mono);direction:ltr;text-align:end;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  html[lang=fa] .tile .v{font-family:Tahoma,Vazirmatn,"Segoe UI",system-ui,sans-serif}
  .tile .s{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .diag{margin-top:10px;padding:10px 12px;border-radius:4px;border:1px solid var(--line);border-inline-start-width:3px;background:var(--card2);font-size:13.5px}
  .diag.warn{border-inline-start-color:var(--mid)}.diag.bad{border-inline-start-color:var(--bad)}.diag.good{border-inline-start-color:var(--ok)}
  .chartbox{margin-top:10px}
  .chartlbl{font-size:12px;color:var(--mute);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  canvas#chart{width:100%;height:166px;display:block;background:var(--plot);border:1px solid var(--line);border-radius:4px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .row button{font-size:13px;padding:7px 12px}
  .sec li{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin:6px 0}
  .sec li b{white-space:nowrap}
  .sec ul{list-style:none;padding:0;margin:0}
  .chips{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}
  .chip{padding:5px 12px;border-radius:99px;font-size:13px}
  .chip.on{border-color:var(--acc);box-shadow:0 0 10px rgba(255,255,255,.3)}
  #status{color:var(--mute);font-size:13px;min-height:20px;margin-bottom:8px}
  ol#list{list-style:none;padding:0;margin:0}
  #list li{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;transition:border-color .15s}
  #list li:hover{border-color:var(--line2)}
  #list li.mon{border-color:var(--acc);box-shadow:0 0 12px rgba(255,255,255,.18)}
  #list li.failed{opacity:.5}
  .rk{color:var(--mute);font:13px var(--mono);min-width:24px;text-align:center}
  .host{direction:ltr;text-align:end;font:13px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{grid-column:2;font-size:12px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .acts{grid-row:1/3;grid-column:3;display:flex;gap:6px}
  .acts .btn,.acts button{padding:6px 10px;font-size:13px}
  .go{background:var(--acc)!important;border-color:var(--acc)!important;color:#000!important;font-weight:bold}
  .go:hover{background:#000!important;color:#fff!important}
  .x{border-color:var(--bad)!important;color:var(--bad)!important;font-weight:bold}
  .x:hover{background:var(--bad)!important;color:#000!important;box-shadow:0 0 12px rgba(255,77,94,.5)!important}
  .x.on{background:var(--bad)!important;color:#000!important}
  .tag{border:1px solid var(--line2);border-radius:3px;padding:0 6px;font-size:11.5px}
  .tag.okk{border-color:var(--ok);color:var(--ok)}.tag.no{border-color:var(--bad);color:var(--bad)}.tag.sh{border-color:var(--line);color:#cfcfcf}
  .g{color:var(--ok)}.y{color:var(--mid)}.r{color:var(--bad)}
  #log{direction:ltr;text-align:left;font:12px/1.5 var(--mono);background:#000;border:1px solid var(--line);border-radius:4px;padding:8px 10px;height:240px;overflow:auto;white-space:pre-wrap;margin:0;color:#d8d8d8}
  #log .e{color:var(--bad)}#log .w{color:var(--mid)}#log .o{color:var(--ok)}#log .t{color:var(--mute)}
  #fb{position:fixed;left:0;right:0;bottom:0;background:rgba(0,0,0,.94);border-top:1px solid var(--acc);box-shadow:0 -6px 24px rgba(255,255,255,.08);padding:10px 14px;display:none;z-index:5}
  #fb .in{max-width:780px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #fb .q{flex:1 1 200px;font-size:14px}
  #fb .yes{border-color:var(--ok);color:var(--ok)}#fb .yes:hover{background:var(--ok);color:#000}
  #fb .no{border-color:var(--bad);color:var(--bad)}#fb .no:hover{background:var(--bad);color:#000}
  details{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
  summary{cursor:pointer;font-weight:bold}
  details p,details li{font-size:13.5px}
  details ol{padding-inline-start:20px}
  footer{margin-top:18px;color:var(--mute);font-size:12px;text-align:center;font-family:var(--mono)}
  footer a{color:var(--mute)}
  ::selection{background:#fff;color:#000}
  @media (max-width:520px){#list li{grid-template-columns:auto 1fr}.acts{grid-row:auto;grid-column:1/3;justify-content:flex-end}}
  @media (prefers-reduced-motion:reduce){#rain{display:none}h1::after{animation:none}}

  .head-actions{display:flex;align-items:center;gap:7px;flex-shrink:0}
  .head-actions button{padding:7px 11px;min-height:35px;justify-content:center}
  .head-actions #securityToggle{color:var(--ok)}
  #securityDetails{margin:9px 0 12px}
  #securityDetails summary{list-style:none;display:flex;gap:9px;align-items:center}
  #securityDetails summary::-webkit-details-marker{display:none}
  #securityDetails summary::after{content:"⌄";margin-inline-start:auto;color:var(--mute)}
  #securityDetails[open] summary::after{content:"⌃"}
  #securityDetails ul{margin-top:14px}
  .micro-hint{font-size:12px;color:var(--mute);margin:-3px 0 8px;line-height:1.8}
  .upgrade{display:none;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;margin:8px 0;background:var(--card2);border:1px solid var(--ok);border-radius:6px;font-size:13px}
  .upgrade.show{display:flex}.upgrade span{flex:1 1 230px}
  .upgrade .btn{font-size:12px;padding:7px 10px;border-color:var(--ok);color:var(--ok)}
  #chartLbl::before{content:"●";color:var(--ok);margin-inline-end:7px;animation:pulse 1.8s infinite}
  :root{--surface:#050505;--plot:#050505;--plot-grid:rgba(255,255,255,.08);--plot-axis:rgba(255,255,255,.25);--plot-trace:#39ff88}
  html{background:var(--bg)}button,.btn{background:var(--surface)}canvas#chart,#log{background:var(--plot)}
  html[data-theme="light"]{--bg:#f1f5f9;--card:rgba(255,255,255,.95);--card2:rgba(239,245,252,.98);--line:#d0dbe7;--line2:#a8b8c9;--fg:#1e293b;--mute:#53657a;--acc:#254b75;--ok:#00864d;--mid:#9b6500;--bad:#c5304c;--surface:#fff;--plot:#f8fbff;--plot-grid:rgba(37,75,117,.09);--plot-axis:rgba(37,75,117,.22);--plot-trace:#00864d}
  html[data-theme="light"] #rain{display:none}
  html[data-theme="light"] body::after{background:repeating-linear-gradient(0deg,rgba(0,0,0,.014) 0 1px,transparent 1px 4px)}
  html[data-theme="light"] .primary,html[data-theme="light"] .go{color:#fff!important}
  html[data-theme="light"] button:hover:not(:disabled),html[data-theme="light"] .btn:hover{color:#fff;background:var(--acc)}
  html[data-theme="light"] .primary:hover,html[data-theme="light"] .go:hover{color:var(--acc)!important;background:#fff!important}
  html[data-theme="light"] #log{color:var(--fg)}
  html[data-theme="light"] #fb{background:rgba(248,251,255,.97)}
  html[data-theme="light"] .tag.sh{color:var(--mute)}
  html[data-theme="light"] ::selection{background:var(--acc);color:#fff}
  @media (max-width:520px){header{gap:7px}.head-actions{gap:5px}.head-actions button{padding:5px 8px}h1{font-size:19px}.wrap{padding-inline:12px}}
  @media (prefers-reduced-motion:reduce){#chartLbl::before{animation:none}}

</style>
</head>
<body>
<canvas id="rain"></canvas>
<div class="wrap">
  <header>
    <div class="t">
      <div class="kicker">AUTOCONNECTOR // MTPROTO // LIVE</div>
      <h1 data-i="title"></h1>
      <div class="sub" id="sub">…</div>
    </div>
    <div class="head-actions">
      <button id="securityToggle" type="button" title="امنیت / Security" aria-label="امنیت / Security" aria-controls="securityDetails" aria-expanded="false">🛡</button>
      <button id="theme" type="button" title="تغییر تم / Toggle theme" aria-label="تغییر تم / Toggle theme">☀</button>
      <button id="lang" title="Language / زبان"></button>
    </div>
  </header>

  <details class="panel sec" id="securityDetails">
    <summary data-i="secT"></summary>
    <ul id="secList"></ul>
  </details>
  <div class="hero">
    <a class="btn primary" id="best" href="#" data-i="best"></a>
    <button id="test" data-i="test"></button>
  </div>

  <p class="micro-hint" data-i="reconnectHint"></p>
  <div class="upgrade" id="upgrade" role="status" aria-live="polite">
    <span id="upgradeText"></span><a id="upgradeGo" class="btn" href="#"></a>
  </div>

  <!-- ===================== live status ===================== -->
  <section class="panel">
    <h2><span class="dot" id="liveDot"></span> <span data-i="live"></span></h2>
    <div class="tiles">
      <div class="tile"><div class="k" data-i="kNet"></div><div class="v" id="tNet">…</div><div class="s" id="tNetS"></div></div>
      <div class="tile"><div class="k" data-i="kTg"></div><div class="v" id="tTg">…</div><div class="s" id="tTgS"></div></div>
      <div class="tile"><div class="k" data-i="kPx"></div><div class="v" id="tPx">—</div><div class="s" id="tPxS"></div></div>
      <div class="tile"><div class="k" data-i="kPing"></div><div class="v" id="tPing">—</div><div class="s" id="tPingS"></div></div>
      <div class="tile"><div class="k" data-i="kDown"></div><div class="v" id="tDown">—</div><div class="s" id="tDownS"></div></div>
      <div class="tile"><div class="k" data-i="kUp"></div><div class="v" id="tUp">—</div><div class="s" id="tUpS"></div></div>
      <div class="tile"><div class="k" data-i="kMon"></div><div class="v" id="tMon">—</div><div class="s" id="tMonS"></div></div>
      <div class="tile"><div class="k" data-i="kLoss"></div><div class="v" id="tLoss">—</div><div class="s" id="tLossS"></div></div>
    </div>
    <div class="diag" id="diag"></div>
    <div class="chartbox">
      <div class="chartlbl" id="chartLbl"></div>
      <canvas id="chart"></canvas>
    </div>
    <div class="row">
      <button id="speed" data-i="speed"></button>
      <button id="tgRecheck" data-i="tgRecheck"></button>
      <button id="monStop" disabled data-i="monStop"></button>
    </div>
    <p class="note" style="margin:10px 0 0" data-i="liveNote"></p>
  </section>

  <div class="chips" id="chips">
    <button class="chip on" data-f="all" data-i="fAll"></button>
    <button class="chip" data-f="faketls" data-i="fTls"></button>
    <button class="chip" data-f="other" data-i="fOther"></button>
  </div>
  <div id="status"></div>
  <ol id="list"></ol>

  <!-- ===================== log ===================== -->
  <details id="logBox" open>
    <summary><span data-i="logT"></span> <span class="note" id="logCount"></span></summary>
    <div class="row" style="margin:8px 0">
      <button id="logCopy" data-i="logCopy"></button>
      <button id="logClear" data-i="logClear"></button>
    </div>
    <pre id="log"></pre>
  </details>

  <details>
    <summary data-i="helpT"></summary>
    <ol id="help"></ol>
  </details>

  <footer>
    <a href="proxies.txt" data-i="fullList"></a> ·
    <a href="proxies.json">JSON</a> ·
    <a href="https://github.com/mohammadrezasmz2/AutoConnector_for_Telegram">AutoConnector for Telegram</a>
  </footer>
</div>

<div id="fb"><div class="in">
  <span class="q" id="fbQ"></span>
  <button class="yes" id="fbYes" data-i="fbYes"></button>
  <button class="no" id="fbNo" data-i="fbNo"></button>
  <button id="fbX">✕</button>
</div></div>

<script>
(() => {
  const $ = s => document.querySelector(s);

  // ============================================================== i18n ==
  const T = {
    fa: {
      title: "پروکسی‌های MTProto تلگرام",
      best: "⚡ اتصال به بهترین پروکسی", test: "📶 تست از دستگاه من",
      live: "وضعیت زنده",
      kNet: "اینترنت شما", kTg: "تلگرام بدون پروکسی", kPx: "پروکسی‌ها از شبکهٔ شما", kPing: "پینگ اینترنت",
      kDown: "دانلود", kUp: "آپلود", kMon: "پروکسی زیر نظر", kLoss: "پایداری پروکسی",
      sPx0: "«تست از دستگاه من» را بزنید", sPing0: "تا Cloudflare", sDown0: "«تست سرعت» را بزنید", sMon0: "روی 📈 یک پروکسی بزنید",
      speed: "⏱ تست سرعت (~۱۵ مگابایت)", tgRecheck: "🔄 بررسی دوبارهٔ تلگرام", monStop: "⏸ توقف پایش",
      liveNote: "سایت نمی‌تواند داخل برنامهٔ تلگرام را ببیند. ترافیک و وضعیت خود تلگرام را فقط اپ AutoConnector نشان می‌دهد. برای همین بعد از هر «اتصال» می‌پرسیم وصل شد یا نه، و دکمهٔ ✗ کنار هر پروکسی هست تا نتیجه ثبت شود.",
      secT: "🛡 امنیت",
      reconnectHint: "💡 هر بار روی «اتصال» بزنید، بهترین گزینهٔ به‌روز شده به تلگرام پیشنهاد می‌شود؛ تغییر پروکسی در خود تلگرام با تأیید شماست.",
      improved: "✨ پروکسی سریع‌تری در فهرست پیدا شد. برای امتحان و جایگزینی در تلگرام روی دکمه بزنید.",
      improvedGo: "⚡ امتحان پروکسی بهتر",
      internetWatch: "اینترنت · Cloudflare", monitorInternet: "🌐 پایش پینگ اینترنت",
      sec1: "<b class='g'>✓ محتوا امن است</b><span>پیام‌ها و فایل‌های شما را خود تلگرام رمز می‌کند. پروکسی فقط دادهٔ رمزشده را جابه‌جا می‌کند و <b>نمی‌تواند</b> آن را بخواند یا تغییر دهد. این برای همهٔ پروکسی‌های MTProto صادق است.</span>",
      sec2: "<b class='y'>! چیزی که پروکسی می‌بیند</b><span>هر پروکسی می‌تواند آی‌پی شما، زمان اتصال و حجم تقریبی داده را ببیند (نه اینکه چه چیزی).</span>",
      sec3: (n, m) => `<b class='g'>✓ فیلتر این لیست</b><span>سرورهای داخل ایران حذف شده‌اند (این دوره: ${n}) تا همین اطلاعات هم داخل ایران نماند. آدرس‌های خصوصی یا نامعتبر (${m}) و هر پروکسی که handshake واقعی تلگرام را رد نکرد هم حذف شده است. مکان سرور از روی آدرس IP ثبت‌شده تشخیص داده می‌شود.</span>`,
      sec4: "<b>💡</b><span>برای گفتگوهای خیلی حساس از Secret Chat تلگرام استفاده کنید (رمزنگاری سرتاسری).</span>",
      fAll: "همه", fTls: "فقط FakeTLS", fOther: "dd و ساده",
      connect: "اتصال", copy: "کپی", watchT: "پایش زنده", xT: "در تلگرام وصل نشد (برای لغو دوباره بزنید)",
      tPlain: "ساده", tOk: "در تلگرام وصل شد", tFail: "در تلگرام وصل نشد", tGrp: n => `${n} هم‌گروه وصل نشد`, tSafe: "🛡 خارج از ایران",
      server: "سرور:", yourDev: "دستگاه شما:", noReply: "پاسخ نداد",
      sub: (a, l, c, n) => `به‌روزرسانی: ${a} · ${l} پروکسی تأییدشده از ${c} · نمایش ${n} تای برتر`,
      now: "همین الان", minAgo: m => `${m} دقیقه پیش`, hAgo: h => `${h} ساعت پیش`, loadFail: "لیست بارگذاری نشد؛ چند دقیقهٔ دیگر دوباره امتحان کنید.",
      testing: (d, n) => `تست از دستگاه شما: ${d} از ${n}…`, testDone: r => `تست تمام شد: ${r} پروکسی از دستگاه شما پاسخ دادند و به ترتیب سرعت مرتب شدند.`,
      ofN: (a, b) => `${a} از ${b}`, pxS: (t, x) => `تایم‌اوت ${t} · رد فوری ${x}`,
      online: "آنلاین", offline: "قطع", open: "باز", blocked: "مسدود", checking: "در حال بررسی", tgS: (o, n) => `${o} از ${n} مقصد پاسخ دادند`,
      err: "خطا", mbIn: (mb, s) => `${mb} MB در ${s} ثانیه`,
      st: { reply: "پاسخ داد", timeout: "بی‌پاسخ", reset: "رد فوری" },
      loss: l => `${l}٪ قطعی`, lossS: (j, o, n) => `jitter ${j}ms · ${o}/${n} پاسخ`,

      bind("tMon",()=>status);
      bind("tMonS",()=> (p ? key(p) : t("internetWatch"))+" · min "+(st.min??"-")+" / max "+(st.max??"-"));
      bind("tLoss",()=>span(loss===0?"g":loss<20?"y":"r",t("loss")(nf(loss))));
      bind("tLossS",()=>t("lossS")(st.jit??"-",nf(st.ok),nf(st.n)));
      if(!p){
        bind("tPing",()=>status);
        bind("tPingS",()=> "min "+(st.min??"-")+" / max "+(st.max??"-")+" ms");
      }
      $("#liveDot").classList.toggle("live",ok);
      if(!ok && st.n%10===0) log("warn","watch "+(p?key(p):"internet")+": "+r.state);
      draw();
      monTimer=setTimeout(tick,2000);
    };
    if(!document.hidden) tick();
  }
  $("#monStop").onclick=()=>watch(null,false,true);
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden){
      ++monGen;clearTimeout(monTimer);monTimer=null;
      $("#liveDot").classList.remove("live");
    }else{
      watch(mon,true,true);
      refreshCatalog();
      minuteMonitor();
    }
  });

    function draw() {
    const c = $("#chart"), dpr = window.devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
    if (!W) return;
    c.width = W * dpr; c.height = H * dpr;
    const g = c.getContext("2d"); g.scale(dpr, dpr); g.clearRect(0, 0, W, H);
    const okv = samples.filter(s => s.ok).map(s => s.ms);
    const top = Math.max(300, ...okv) * 1.15, pad = 16, L = 44, n = 90, dx = (W - L - pad) / (n - 1);
    g.font = "10px ui-monospace,monospace"; g.direction = "ltr"; g.textAlign = "left"; g.lineWidth = 1;
    const style = getComputedStyle(document.documentElement);
    g.strokeStyle = style.getPropertyValue("--plot-grid").trim() || "rgba(255,255,255,.08)";
    for (let x = L; x <= W - pad; x += 24) { g.beginPath(); g.moveTo(x, pad); g.lineTo(x, H - pad); g.stroke(); }
    g.strokeStyle = style.getPropertyValue("--plot-axis").trim(); g.fillStyle = style.getPropertyValue("--mute").trim();
    for (const v of [0, top / 2, top]) {
      const y = H - pad - (v / top) * (H - 2 * pad);
      g.beginPath(); g.moveTo(L, y); g.lineTo(W - pad, y); g.stroke();
      g.fillText(Math.round(v) + "ms", 4, y + 3);
    }
    const x0 = W - pad - (samples.length - 1) * dx;
    const trace = style.getPropertyValue("--plot-trace").trim();
    g.strokeStyle = trace; g.lineWidth = 2.4; g.shadowColor = trace; g.shadowBlur = 11; g.beginPath();
    let pen = false;
    samples.forEach((s, i) => {
      if (!s.ok) { pen = false; return; }
      const x = x0 + i * dx, y = H - pad - (s.ms / top) * (H - 2 * pad);
      pen ? g.lineTo(x, y) : g.moveTo(x, y); pen = true;
    });
    g.stroke(); g.shadowBlur = 0;
    const last = samples[samples.length-1];
    if (last && last.ok) {
      const yy=H-pad-(last.ms/top)*(H-2*pad);
      g.fillStyle=trace; g.shadowColor=trace; g.shadowBlur=14; g.beginPath();g.arc(W-pad,yy,4,0,Math.PI*2);g.fill();g.shadowBlur=0;
    }
    g.fillStyle = style.getPropertyValue("--bad").trim();
    samples.forEach((s, i) => { if (!s.ok) { g.beginPath(); g.arc(x0 + i * dx, pad, 3, 0, 7); g.fill(); } });
    const lbl = $("#chartLbl"); lbl.textContent = t("chart") + (mon ? " · " : "");
    { const b = document.createElement("bdi"); b.textContent = mon ? key(mon) : t("internetWatch"); lbl.append(b); }
  }
  window.addEventListener("resize", draw);

  // ======================================================== network info ==
  function netInfo() {
    const c = navigator.connection;
    bind("tNet", () => navigator.onLine ? span("g", t("online")) : span("r", t("offline")));
    bind("tNetS", () => c ? `${c.type && c.type !== "unknown" ? c.type + " · " : ""}${c.effectiveType || ""} · rtt ${c.rtt ?? "-"}ms · ~${c.downlink ?? "-"}Mbps` : "");
  }
  window.addEventListener("online", () => { netInfo(); log("ok", "browser: back online"); checkTelegram(); });
  window.addEventListener("offline", () => { netInfo(); log("err", "browser: OFFLINE"); diagnose(); });
  if (navigator.connection) navigator.connection.addEventListener("change", () => {
    const c = navigator.connection; netInfo();
    log("info", `network changed: ${c.type || ""} ${c.effectiveType} rtt=${c.rtt}ms down~${c.downlink}Mbps`);
  });

  // ============================================== Telegram without proxy ==
  let tg = null;
  const TGT = [["DC2 149.154.167.51", "https://149.154.167.51/"], ["DC4 149.154.167.91", "https://149.154.167.91/"],
               ["DC1 149.154.175.53", "https://149.154.175.53/"], ["web.telegram.org", "https://web.telegram.org/favicon.ico"]];
  async function checkTelegram() {
    bind("tTg", () => "…"); bind("tTgS", () => t("checking"));
    const res = await Promise.all(TGT.map(([n, u]) => probeUrl(u + "?_=" + Math.random(), 5000).then(r => [n, r])));
    res.forEach(([n, r]) => log(r.state === "reply" ? "info" : "warn", `telegram direct ${n}: ${r.state} ${r.ms}ms`));
    const open = res.filter(([, r]) => r.state === "reply").length;
    tg = { open: open >= 2, n: open };
    bind("tTg", () => tg.open ? span("g", t("open")) : span("r", t("blocked")));
    bind("tTgS", () => t("tgS")(nf(open), nf(res.length)));
    diagnose();
  }
  $("#tgRecheck").onclick = checkTelegram;

  // ===================================================== internet speed ==
  const CF = "https://speed.cloudflare.com", mbps = (b, ms) => b * 8 / ms / 1000;
  async function pingInternet() {
    const v = [];
    for (let i = 0; i < 6; i++) {
      const t0 = performance.now();
      try { await fetch(`${CF}/__down?bytes=0&_=${Math.random()}`, { cache: "no-store" }); v.push(performance.now() - t0); } catch (e) {}
    }
    if (v.length < 2) { bind("tPing", () => span("r", t("err"))); log("err", "internet ping: speed.cloudflare.com unreachable"); return; }
    v.shift(); v.sort((a, b) => a - b);
    const med = Math.round(v[v.length >> 1]), lo = Math.round(v[0]), hi = Math.round(v[v.length - 1]);
    bind("tPing", () => span(cls(med), `${med} ms`)); bind("tPingS", () => `min ${lo} / max ${hi} ms`);
    log("info", `internet ping (cloudflare): median ${med}ms, min ${lo}ms`);
  }
  async function download() {
    const ctl = new AbortController(), t0 = performance.now(); let got = 0;
    const stop = setTimeout(() => ctl.abort(), 8000);
    try {
      const r = await fetch(`${CF}/__down?bytes=12000000&_=${Math.random()}`, { cache: "no-store", signal: ctl.signal });
      const rd = r.body.getReader(); let last = 0;
      for (;;) {
        const { done, value } = await rd.read(); if (done) break;
        got += value.length; const ms = performance.now() - t0;
        if (ms - last > 250) { last = ms; const v = mbps(got, ms).toFixed(1), mb = (got / 1e6).toFixed(1); bind("tDown", () => v + " Mbps"); bind("tDownS", () => mb + " MB …"); }
      }
    } catch (e) { if (!ctl.signal.aborted) log("err", `download test: ${e.message}`); }
    clearTimeout(stop);
    const ms = performance.now() - t0, v = mbps(got, ms), mb = (got / 1e6).toFixed(1), sec = (ms / 1000).toFixed(1);
    bind("tDown", () => v.toFixed(1) + " Mbps"); bind("tDownS", () => t("mbIn")(mb, sec));
    log(got ? "info" : "err", `download: ${v.toFixed(2)} Mbps (${mb} MB in ${sec}s)`);
  }
  async function upload() {
    const chunk = new Uint8Array(1000000), t0 = performance.now(); let sent = 0;
    while (performance.now() - t0 < 7000 && sent < 6e6) {
      try { await fetch(`${CF}/__up?_=${Math.random()}`, { method: "POST", body: chunk, cache: "no-store" }); sent += chunk.length; }
      catch (e) { log("err", `upload test: ${e.message}`); break; }
      const v = mbps(sent, performance.now() - t0).toFixed(1), mb = (sent / 1e6).toFixed(0);
      bind("tUp", () => v + " Mbps"); bind("tUpS", () => mb + " MB …");
    }
    const ms = performance.now() - t0, v = mbps(sent, ms), mb = (sent / 1e6).toFixed(0), sec = (ms / 1000).toFixed(1);
    bind("tUp", () => sent ? v.toFixed(1) + " Mbps" : span("r", t("err"))); bind("tUpS", () => t("mbIn")(mb, sec));
    log(sent ? "info" : "err", `upload: ${v.toFixed(2)} Mbps (${mb} MB in ${sec}s)`);
  }
  $("#speed").onclick = async () => {
    const b = $("#speed"); b.disabled = true;
    log("info", "speed test started (speed.cloudflare.com)");
    bind("tDown", () => "…"); bind("tUp", () => "…");
    await pingInternet(); await download(); await upload();
    b.disabled = false; diagnose();
  };

  // ======================================================== device test ==
  let pxSummary = null;
  $("#test").onclick = async () => {
    const btn = $("#test"), uniq = [], seen = new Set();
    for (const p of view()) { if (!seen.has(key(p)) && !BAD.has(p.port)) { seen.add(key(p)); uniq.push(p); } if (uniq.length >= 60) break; }
    btn.disabled = true; dev = {};
    log("info", `device test: probing ${uniq.length} proxies from this network…`);
    const counts = { reply: 0, timeout: 0, reset: 0 };
    let done = 0, i = 0;
    const worker = async () => {
      while (i < uniq.length) {
        const p = uniq[i++];
        let best = null, st = null;
        for (let k = 0; k < 2; k++) {
          const r = await probeUrl(proxyUrl(p), 4000);
          st = r.state; if (r.state !== "reply") break;
          best = best === null ? r.ms : Math.min(best, r.ms);
        }
        dev[key(p)] = best ?? -1; counts[best !== null ? "reply" : st]++;
        if (best === null) log("warn", `device ${key(p)}: ${st}`);
        done++; bind("status", () => t("testing")(nf(done), nf(uniq.length)));
      }
    };
    await Promise.all(Array.from({ length: 6 }, worker));
    pxSummary = { ...counts, n: uniq.length };
    log(counts.reply ? "ok" : "err", `device test done: reply ${counts.reply}, timeout ${counts.timeout}, reset ${counts.reset} (of ${uniq.length})`);
    bind("status", () => t("testDone")(nf(counts.reply)));
    bind("tPx", () => span(counts.reply ? "g" : "r", t("ofN")(nf(counts.reply), nf(uniq.length))));
    bind("tPxS", () => t("pxS")(nf(counts.timeout), nf(counts.reset)));
    btn.disabled = false; render(); diagnose();
  };

  // ========================================================== diagnosis ==
  function diagnose() {
    const d = $("#diag"), D = t("d"), fails = Object.values(fb).filter(x => x === "fail").length, oks = Object.values(fb).filter(x => x === "ok").length;
    let c = "", m;
    if (!navigator.onLine) { c = "bad"; m = D.offline; }
    else if (tg && tg.open) { c = "good"; m = D.tgOpen; }
    else if (oks) { c = "good"; m = D.oks(nf(oks)); }
    else if (pxSummary && pxSummary.reply === 0) { c = "bad"; m = D.noReach; }
    else if (fails >= 3 && pxSummary && pxSummary.reply > 0) { c = "warn"; m = D.dpi(nf(pxSummary.reply), nf(fails)); }
    else if (tg && !tg.open) { c = "warn"; m = D.tgBlocked; }
    else m = D.wait;
    d.className = "diag " + c; d.innerHTML = m;
  }

  // ======================================================== matrix rain ==
  (function rain() {
    const c = $("#rain"), g = c.getContext("2d");
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const glyphs = "01アイウエオカキクケコサシスセソタチツテトナニヌネノ۰۱۲۳۴۵۶۷۸۹ABCDEF<>/".split("");
    let W, H, cols, drops, fs = 15;
    const size = () => { W = c.width = innerWidth; H = c.height = innerHeight; cols = Math.ceil(W / fs); drops = Array.from({ length: cols }, () => Math.random() * -H / fs); };
    size(); addEventListener("resize", size);
    setInterval(() => {
      if (document.hidden) return;
      g.fillStyle = "rgba(0,0,0,.09)"; g.fillRect(0, 0, W, H);
      g.font = fs + "px monospace";
      for (let i = 0; i < cols; i++) {
        const y = drops[i] * fs;
        g.fillStyle = Math.random() < .08 ? "#fff" : "rgba(220,220,220,.55)";
        g.fillText(glyphs[(Math.random() * glyphs.length) | 0], i * fs, y);
        if (y > H && Math.random() > .975) drops[i] = 0;
        drops[i] += 1;
      }
    }, 55);
  })();

  // =============================================================== boot ==
  $("#chips").onclick = e => {
    const el = e.target.closest("[data-f]"); if (!el) return;
    filter = el.dataset.f;
    document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === el));
    render();
  };
  function ago(ts) {
    const m = Math.round((Date.now() / 1000 - ts) / 60);
    return m < 1 ? t("now") : m < 60 ? t("minAgo")(nf(m)) : t("hAgo")(nf(Math.round(m / 60)));
  }

  bind("tPxS", () => t("sPx0")); bind("tPingS", () => t("sPing0")); bind("tDownS", () => t("sDown0")); bind("tMonS", () => t("sMon0"));
  bind("sub", () => "…");
  applyLang();
  applyTheme();

  const ua = navigator.userAgent;
  const plat = /Android/i.test(ua) ? "Android" : /iPhone|iPad/i.test(ua) ? "iOS" : /Windows/i.test(ua) ? "Windows" : /Mac/i.test(ua) ? "macOS" : /Linux/i.test(ua) ? "Linux" : "?";
  const brw = /Edg\//.test(ua) ? "Edge" : /Firefox\//.test(ua) ? "Firefox" : /Chrome\//.test(ua) ? "Chrome" : /Safari\//.test(ua) ? "Safari" : "?";
  log("info", `page opened · ${plat} · ${brw} · lang=${lang} · online=${navigator.onLine}` + (navigator.connection ? ` · ${navigator.connection.effectiveType} rtt=${navigator.connection.rtt}ms` : ""));
  const prev = Object.values(fb);
  if (prev.length) log("info", `earlier reports on this device: ${prev.filter(x => x === "ok").length} connected, ${prev.filter(x => x === "fail").length} failed`);
  netInfo();

  fetch("proxies.json?_=" + Date.now(), { cache: "no-store" })
    .then(r => r.json())
    .then(d => {
      meta = d; all = d.proxies || [];
      bind("sub", () => t("sub")(ago(d.updated), nf(d.live), nf(d.collected), nf(all.length)));
      log("info", `list loaded: ${all.length} proxies, built ${new Date(d.updated * 1000).toISOString().slice(0, 16)}Z` +
        (d.removed ? ` · safety filter removed iran=${d.removed.iran} private=${d.removed.private} unresolved=${d.removed.unresolved}` : ""));
      renderSec(); render();
    })
    .catch(e => { bind("sub", () => t("loadFail")); log("err", `list load failed: ${e.message}`); });

  checkTelegram();
  watch(null,true);
})();
</script>
