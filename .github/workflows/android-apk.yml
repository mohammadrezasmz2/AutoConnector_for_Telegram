name: Build Android APK

# Builds an installable APK on every push to main (and on demand from the
# Actions tab). Download it from the run's "Artifacts" section.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # The project has no Gradle wrapper; AGP 8.5 needs Gradle >= 8.7.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        env:
          GRADLE_OPTS: -Xmx3g
        run: gradle :composeApp:assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AutoConnector-android-debug
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
