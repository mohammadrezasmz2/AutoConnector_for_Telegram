name: Build Windows EXE

# Builds the desktop app as a Windows installer (.exe) via jpackage. jpackage
# only produces a Windows installer when it runs on Windows, so this uses a
# Windows runner. The .exe is pushed to the `ci-exe` branch (like the APK to
# ci-apk) and also attached to the run's artifacts.
on:
  push:
    branches: [ main ]
    paths:
      - 'composeApp/**'
      - 'engineDesktop/**'
      - '.github/workflows/windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Same private bootstrap config the Android build injects.
      - name: Inject bootstrap config
        shell: bash
        env:
          CLUB_CONSTANTS: ${{ secrets.CLUB_CONSTANTS }}
        run: |
          if [ -z "$CLUB_CONSTANTS" ]; then echo "no CLUB_CONSTANTS secret — bootstrap stays off"; exit 0; fi
          # Pure bash/sed so it works the same on the Windows runner (no /tmp,
          # no python path quirks). Each int[] line is a single line.
          echo "$CLUB_CONSTANTS" | base64 -d > club_cfg.txt
          F=composeApp/src/androidMain/java/io/autoconnector/engine/scan/CovertBootstrap.java
          for N in U K L; do
            LINE=$(grep -oE "private static final int\[\] $N = \{[^}]*\};" club_cfg.txt)
            if [ -n "$LINE" ]; then
              ESC=$(printf '%s' "$LINE" | sed -e 's/[\/&]/\\&/g')
              sed -i -E "s/private static final int\[\] $N = \{[^}]*\};/$ESC/" "$F"
            fi
          done
          rm -f club_cfg.txt
          echo "bootstrap config injected"

      # Compose's Kotlin compile is memory-heavy; the default heap OOMs on the
      # runner. Give the Gradle JVM room and compile the Kotlin in-process so it
      # uses that heap. (The Compose plugin downloads WiX itself for the installer.)
      - name: Raise build memory
        shell: bash
        run: |
          printf '\norg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g\nkotlin.compiler.execution.strategy=in-process\nkotlin.incremental=false\n' >> gradle.properties
          cat gradle.properties

      - name: Build Windows app
        id: pkg
        shell: bash
        run: |
          mkdir -p out
          RUN=1.2.${{ github.run_number }}
          # Try the real installer first; fall back to a portable zip if jpackage can't.
          if gradle :composeApp:packageExe --no-daemon --stacktrace 2>&1 | tee build.log \
               && EXE=$(ls composeApp/build/compose/binaries/main/exe/*.exe 2>/dev/null | head -1) \
               && [ -n "$EXE" ]; then
            cp "$EXE" "out/AutoConnector-Setup-$RUN.exe"
          else
            echo "::warning::installer step failed — building a portable app-image instead"
            gradle :composeApp:createDistributable --no-daemon --stacktrace 2>&1 | tee -a build.log
            APPDIR="composeApp/build/compose/binaries/main/app/AutoConnector"
            powershell -Command "Compress-Archive -Path '$APPDIR/*' -DestinationPath 'out/AutoConnector-Portable-$RUN.zip' -Force"
          fi
          ls -la out

      - name: Diagnostics
        if: failure()
        shell: bash
        run: |
          echo "----- tail of build.log -----"
          tail -80 build.log || echo "(no build.log)"
          mkdir -p "$RUNNER_TEMP/logs"
          cp build.log "$RUNNER_TEMP/logs/win-build.log" 2>/dev/null || echo "no build.log" > "$RUNNER_TEMP/logs/win-build.log"
          cd "$RUNNER_TEMP/logs"
          git init -q && git checkout -q -b ci-logs-win && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "win build log ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-win || echo "push failed"

      - uses: actions/upload-artifact@v4
        with:
          name: AutoConnector-windows
          path: out/*
          if-no-files-found: error

      - name: Publish to the ci-exe branch
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pub" && cp out/* "$RUNNER_TEMP/pub/" && cd "$RUNNER_TEMP/pub"
          git init -q && git checkout -q -b ci-exe
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "Windows build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-exe
