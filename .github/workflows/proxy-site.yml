name: Proxy web page

# Every 10 minutes (best-effort GitHub Actions schedule): collect public MTProto proxies,
# verify each with a real
# MTProto handshake (must return Telegram's resPQ), rank them and
# publish web/index.html + proxies.json to GitHub Pages.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The page is then at https://<user>.github.io/<repo>/
#
# GitHub Actions scheduled starts can be delayed or skipped under load.
# This workflow does not push commits, so it never triggers the APK build.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ "web/**", ".github/workflows/proxy-site.yml" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: proxy-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fail before deploying if JavaScript references an HTML element removed
      # by a layout change (the cause of the blank-label regression).
      - name: Validate browser script and element references
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          page = pathlib.Path("web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", page, re.I)
          if len(scripts) != 1:
              sys.exit(f"Expected one inline application script, got {len(scripts)}")
          script = scripts[0]
          ids = set(re.findall(r'\bid=["\']([^"\']+)["\']', page))
          refs = set(re.findall(r'\$\(\s*["\']#([A-Za-z0-9_-]+)["\']\s*\)', script))
          missing = sorted(refs - ids)
          if missing:
              sys.exit("Undeclared DOM ids used by JS: " + ", ".join(missing))
          for name in ("title", "best", "live", "kNet", "secT"):
              if f'data-i="{name}"' not in page:
                  sys.exit(f"Required translated UI label missing: {name}")
          pathlib.Path("/tmp/ac-site-check.js").write_text(script, encoding="utf-8")
          print(f"Site smoke check: {len(ids)} ids, {len(refs)} JS element references, no missing selectors")
          PY
          node --check /tmp/ac-site-check.js

      - name: Install and regression-test MTProto quality ranking
        run: |
          pip install --quiet cryptography
          python3 -m unittest discover -s web -p 'test_proxy_rank.py' -v

      # Each workflow run stores a new cache key, then the following run
      # restores the newest matching entry. Failed/incomplete runs do not
      # erase the last successful history.
      - name: Restore MTProto history
        uses: actions/cache/restore@v4
        with:
          path: .cache/proxy-health.json
          key: proxy-health-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            proxy-health-

      - name: Collect, check and rank proxies
        run: |
          python3 web/build_site.py --out site --top 300 --history .cache/proxy-health.json

      - name: Validate published MTProto scores
        run: |
          python3 - <<'PY'
          import json, math
          data = json.load(open('site/proxies.json', encoding='utf-8'))
          items = data['proxies']
          assert items, 'no verified proxies'
          for p in items:
              assert p['ok'] >= 1 and p['tries'] >= p['ok'], 'invalid handshake counters'
              assert p['ms'] >= 0 and math.isfinite(p['score']), 'invalid proxy score'
              assert 0 <= p['stability'] <= 100, 'invalid reliability value'
          assert all(a['score'] <= b['score'] for a,b in zip(items,items[1:])), 'catalog is not ranked'
          print('Verified ranked MTProto catalog:', len(items), 'proxies')
          PY

      - name: Save MTProto history for next scan
        uses: actions/cache/save@v4
        with:
          path: .cache/proxy-health.json
          key: proxy-health-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
